<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF5D73"/>
      <stop offset="100%" stop-color="#8257FF"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#g1)"/>
  <!-- Letter N -->
  <text x="10" y="48"
        font-family="Arial, sans-serif"
        font-weight="900"
        font-size="40"
        fill="#0A0D28"
        letter-spacing="-2">N</text>
  <!-- Small M subscript hint -->
  <text x="36" y="52"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="16"
        fill="rgba(10,13,40,0.7)">M</text>
